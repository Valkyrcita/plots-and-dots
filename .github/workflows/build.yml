name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar Android SDK (ya viene instalado en el servidor)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" >> "$ANDROID_HOME/licenses/android-sdk-license"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Install dependencies
        run: npm install

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MA MI PA <<< "$VERSION"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          if [ "$CODE" -lt 1 ]; then CODE=1; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Version $VERSION (code $CODE)"

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Guardado en Descargas (plugin nativo)
        run: |
          PKG=android/app/src/main/java/com/valkyrcita/plotsanddots
          mkdir -p "$PKG"
          cp android-extra/Descargas.java "$PKG/Descargas.java"
          cp android-extra/MainActivity.java "$PKG/MainActivity.java"
          python3 android-extra/parche-manifest.py android/app/src/main/AndroidManifest.xml
          grep -n "WRITE_EXTERNAL_STORAGE" android/app/src/main/AndroidManifest.xml || true

      - name: Patch version in build.gradle
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.ver.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle | head -20

      - name: Preparar firma
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "::error::FALTAN LOS SECRETS (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Sin la firma correcta el APK no se instalaria encima de la version anterior y se perderian los datos. Se cancela la compilacion."
            exit 1
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mkdir -p $GITHUB_WORKSPACE/out
          cp app/build/outputs/apk/release/app-release.apk \
             $GITHUB_WORKSPACE/out/plots-and-dots-${{ steps.ver.outputs.version }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plots-and-dots-apk
          path: out/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Plots & Dots v${{ steps.ver.outputs.version }}
          files: out/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
